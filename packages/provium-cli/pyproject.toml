[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "provium-cli"
version = "0.5.0"
description = "Command-line interface and command plugin system for Provium"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["provium>=0.5.0", "PyYAML>=6,<7"]

[project.scripts]
provium = "provium_cli:main"

[project.entry-points."provium_cli.command_catalogs"]
core = "provium_cli.commands:catalog"

[project.optional-dependencies]
test = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.16",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = [
    "--strict-config",
    "--strict-markers",
    "--cov=provium_cli",
    "--cov-branch",
    "--cov-report=term-missing",
    "--cov-fail-under=100",
]
testpaths = ["test"]
pythonpath = ["../provium/test"]

[tool.coverage.run]
branch = true
source = ["provium_cli"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = false

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "TRY", "UP"]
ignore = ["TRY003"]

[tool.ruff.lint.isort]
known-first-party = ["provium", "provium_cli"]
