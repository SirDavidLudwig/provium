name: Release

on:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  release-please:
    name: Create or update release pull requests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: googleapis/release-please-action@v4
        with:
          target-branch: master
