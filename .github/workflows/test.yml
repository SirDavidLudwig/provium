name: Tests

on:
  push:
  pull_request:

jobs:
  lint-format:
    name: Lint and format check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install pyright ruff
      - name: Lint Provium core
        working-directory: packages/provium
        run: ruff check src test typecheck
      - name: Check Provium core formatting
        working-directory: packages/provium
        run: ruff format --check src test typecheck
      - name: Check Provium core types
        working-directory: packages/provium
        run: python -m pyright
      - name: Lint Provium CLI
        working-directory: packages/provium-cli
        run: ruff check src test
      - name: Check Provium CLI formatting
        working-directory: packages/provium-cli
        run: ruff format --check src test

  test:
    name: ${{ matrix.package.name }} (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: lint-format
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
        package:
          - name: provium
            path: packages/provium
          - name: provium-cli
            path: packages/provium-cli

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install workspace packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "./packages/provium[test]" -e "./packages/provium-cli[test]"
      - name: Run package tests
        working-directory: ${{ matrix.package.path }}
        run: pytest --cov-report=xml
      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v5
        with:
          disable_search: true
          fail_ci_if_error: true
          files: ${{ matrix.package.path }}/coverage.xml
          flags: ${{ matrix.package.name }}
          use_oidc: true
