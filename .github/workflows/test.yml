name: Tests

on:
  push:
  pull_request:

jobs:
  lint-format:
    name: Lint and format check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install pyright ruff
      - name: Lint Provium
        working-directory: packages/provium
        run: ruff check src test typecheck
      - name: Check Provium formatting
        working-directory: packages/provium
        run: ruff format --check src test typecheck
      - name: Check Provium types
        working-directory: packages/provium
        run: python -m pyright
  test:
    name: Provium (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: lint-format
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install workspace packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "./packages/provium[test]"
      - name: Run package tests
        working-directory: packages/provium
        run: pytest --cov-report=xml
      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v5
        with:
          disable_search: true
          fail_ci_if_error: true
          files: packages/provium/coverage.xml
          flags: provium
          use_oidc: true
