[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "provium-text-pipeline-example"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["provium>=0.5.0"]
description = "A full-fledged Provium example plugin for text tokenization and aggregation workflows."
readme = "README.md"

[project.optional-dependencies]
test = ["pytest>=8.3"]

[project.entry-points."provium.artifact_catalogs"]
example = "provium_text_pipeline_example.artifact:catalog"

[project.entry-points."provium.procedure_catalogs"]
example = "provium_text_pipeline_example.procedure:catalog"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["test"]
