[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "provium"
version = "0.3.0"
description = "Typed binary artifacts with automatic provenance"
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.scripts]
provium = "provium.cli:main"

[project.urls]
Homepage = "https://github.com/SirDavidLudwig/provium"
Issues = "https://github.com/SirDavidLudwig/provium/issues"
Repository = "https://github.com/SirDavidLudwig/provium"

[project.optional-dependencies]
visualization = [
    "graphviz>=0.20",
]
test = [
    "pydantic>=2.10",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.16",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = [
    "--strict-config",
    "--strict-markers",
    "--cov=provium",
    "--cov-branch",
    "--cov-report=term-missing",
    "--cov-fail-under=100",
]
testpaths = ["test"]

[tool.coverage.run]
branch = true
source = ["provium"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = false

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "TRY", "UP"]
ignore = ["TRY003"]
